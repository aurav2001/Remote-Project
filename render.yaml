services:
  - type: web
    name: remote-desktop-signaling
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000

  - type: web
    name: remoteg-portal
    runtime: node
    plan: free
    rootDir: controller-web
    buildCommand: npm install && npm run build && npm install -g serve
    startCommand: serve dist -s -l $PORT
    envVars:
      - key: PORT
        value: 3000
