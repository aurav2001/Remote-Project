<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnioTechIT - Remote Host Agent</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151c2e;
      --card-border: #232f48;
      --color-primary: #6366f1;
      --color-accent: #38bdf8;
      --color-success: #10b981;
      --color-error: #ef4444;
      --color-text: #f8fafc;
      --color-text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--color-text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 32px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .header img {
      height: 52px;
      max-width: 200px;
      object-fit: contain;
      margin-bottom: 2px;
    }

    .header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--color-text-muted);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-error);
    }

    .status-dot.connecting {
      background-color: #f59e0b;
    }

    .status-dot.connected {
      background-color: var(--color-success);
    }

    .room-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .room-card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .room-id-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .room-id {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #38bdf8;
      font-family: 'Outfit', monospace;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--color-text);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-copy:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .select-screen {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--color-text);
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-start:hover {
      opacity: 0.92;
    }

    .btn-start:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }

    .info-footer {
      font-size: 0.76rem;
      color: var(--color-text-muted);
      margin-top: 22px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.png" alt="UnioTechIT Logo" />
      <h1>UnioTechIT</h1>
      <p>System Agent Node &bull; Unattended Access</p>
    </div>

    <div class="status-badge">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Ready &bull; Waiting for Controller</span>
    </div>

    <!-- Company Workspace Badge with Inline Edit -->
    <div class="company-group-card" style="background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.82rem; text-align: left;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 1.1rem;">🏢</span>
          <div>
            <span style="color: var(--color-text-muted); font-size: 0.68rem; text-transform: uppercase; font-weight: 700; display: block; letter-spacing: 0.06em;">Company / Organization Group</span>
            <strong id="company-group-text" style="color: #38bdf8; font-size: 0.95rem; letter-spacing: 0.5px;">USPL</strong>
          </div>
        </div>
        <button id="btn-edit-group" class="btn-copy" title="Edit Company Workspace Code" style="width: 30px; height: 30px; border-radius: 8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
      </div>

      <!-- Inline Edit Panel -->
      <div id="company-edit-panel" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(56, 189, 248, 0.2);">
        <div style="display: flex; gap: 6px;">
          <input 
            type="text" 
            id="company-group-input" 
            placeholder="e.g. USPL, TATA, HDFC" 
            style="flex: 1; background: #0f172a; border: 1px solid rgba(56, 189, 248, 0.4); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; font-family: inherit; font-weight: 600;"
          />
          <button id="btn-save-group" style="background: #0284c7; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: inherit;">Save</button>
          <button id="btn-cancel-group" style="background: rgba(255,255,255,0.1); color: #94a3b8; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-family: inherit;">✕</button>
        </div>
      </div>
    </div>

    <div class="room-card">
      <div class="room-card-label">Permanent Access Code (Host ID)</div>
      <div class="room-id-container">
        <span id="room-id" class="room-id">------</span>
        <button id="btn-copy" class="btn-copy" title="Copy code">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <button id="btn-reset-code" class="btn-copy" title="Regenerate Permanent Access Code">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="input-group">
      <label for="screen-select">Select Display to Stream</label>
      <select id="screen-select" class="select-screen">
        <option value="screen:0:0">Primary Display (Auto)</option>
      </select>
    </div>

    <button id="btn-start" class="btn-start">Screen Streaming Active</button>
    
    <div class="info-footer">
      ⚡ <strong>Unattended Direct Access Active:</strong> This machine is ready for remote connection automatically on launch.
    </div>
  </div>

  <!-- Instant Room ID Initializer -->
  <script>
    (function() {
      try {
        var savedCode = localStorage.getItem('remoteg_permanent_access_code');
        if (!savedCode || savedCode.length !== 6) {
          savedCode = Math.floor(100000 + Math.random() * 900000).toString();
          localStorage.setItem('remoteg_permanent_access_code', savedCode);
        }
        var el = document.getElementById('room-id');
        if (el) el.innerText = savedCode;
      } catch(e) {}
    })();
  </script>

  <!-- Standalone Socket.io Client -->
  <script src="socket.io.min.js"></script>

  <!-- Load renderer script -->
  <script src="renderer.js"></script>
</body>
</html>
