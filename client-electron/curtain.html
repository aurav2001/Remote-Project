<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Curtain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #f8fafc;
      overflow: hidden;
      cursor: none;
    }
    .curtain-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 60px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(20px);
      max-width: 540px;
    }
    .lock-icon-wrapper {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin-bottom: 24px;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 40px rgba(168, 85, 247, 0.6);
        transform: scale(1.05);
      }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #c084fc;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 10px #c084fc;
      animation: blink 1.5s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="curtain-card">
    <div class="lock-icon-wrapper">
      🔒
    </div>
    <h1>Remote Privacy Screen Active</h1>
    <p>
      A secure IT maintenance session is in progress.<br>
      The physical screen display is hidden to protect confidential data & passwords.
    </p>
    <div class="status-tag">
      <span class="status-dot"></span>
      <span>Encrypted Remote Session</span>
    </div>
  </div>
</body>
</html>
